# Tells the pipeline when to run, i.e on every push to main.
trigger:
  branches:
    include:
      - main

# Centralised values that can be reused across multiple steps below.
variables:
  buildConfiguration: Release
  dotnetVersion: '10.x'

# Top level list: each stage runs sequentially by default.
stages:

  # ─────────────────────────────────────────────
  # STAGE 1: Build, test, and produce an artifact
  # ─────────────────────────────────────────────

  - stage: Build
    displayName: 'Build & Test'
    # Jobs inside a stage are units of work, each one gets it's own agent.
    jobs:
      - job: BuildJob
        # Use a free Microsoft-hosted Linux agent.
        pool:
          vmImage: ubuntu-latest
        steps:
        # Agents don't have .NET pre-installed, this downloads and installs it.
        # includePreviewVersions is required for .NET 10 whilst it is in preview.
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            version: $(dotnetVersion)
            includePreviewVersions: true

        # This downloads all the Nuget packages the solution uses. Sensible to separate this into it's own step so we can see if this step specifically fails.
        - script: dotnet restore
          displayName: 'Restore Packages'

        # Compile in release mode. --no-restore avoids running the above restore script twice.
        - script: dotnet build --configuration $(buildConfiguration) --no-restore
          displayName: 'Build solution'

        # Run all test projects. --no-build skips rebuilding/recompiling what we just built in the previous script.
        - script: dotnet test --configuration $(buildConfiguration) --no-build --verbosity normal
          displayName: 'Run tests'

        # Compile and publish the API to a staging folder on the agent.
        # $(Build.ArtifactStagingDirectory) is a built-in variable, for a temp folder that Azure Pipelines guarantees exists and is clean on every run.
        - script: >
            dotnet publish Toolbox.Api/Toolbox.Api.csproj
            --configuration $(buildConfiguration)
            --output $(Build.ArtifactStagingDirectory)/api
          displayName: 'Publish API'

        # Upload that folder as a named artifact called 'toolbox-api'
        # It will appear in the pipeline run UI and can be downloaded by later stages.
        - task: PublishPipelineArtifact@1
          displayName: 'Upload artifact'
          inputs:
            targetPath: $(Build.ArtifactStagingDirectory)/api
            artifact: toolbox-api

      # Built In Variables Worth Knowing/Being Aware Of:
      # $(Build.ArtifactStagingDirectory) > A clean temp folder, e.g /home/runner/work/_temp.
      # $(Build.BuildId) > the unique run number.
      # $(Build.SourceBranchName) > The branch that triggered the run, e.g main.
      # $(Pipeline.Workspace) > Root workspace folder, used in the deploy stages to download artifacts.
      # Azure Pipelines injects these automatically, I never need to set them myself.

  # ─────────────────────────────────────────────
  # STAGE 2: Deploy to the Dev environment
  # dependsOn: Build means this stage only starts after Build succeeds.
  # condition: succeeded() means skip this stage if Build failed.
  # ─────────────────────────────────────────────
  - stage: Deploy_Dev
    displayName: 'Deploy → Dev'
    # Explicit ordering, Deploy_Dev won't start until Build finishes.
    dependsOn: Build
    # Gates the stage, if Build fails, Deploy is skipped entirely.
    condition: succeeded()
    jobs:
      # 'deployment' (not 'job') links this to an Environment in Azure DevOps.
      # This unlocks deployment history and approval gates.
      - deployment: DeployDev
        displayName: 'Deploy to Dev App Service'
        pool:
          vmImage: ubuntu-latest
        # 'environment' references the named Environment created in Azure DevOps.
        # The pipeline will create it automatically on the first run if it doesn't exist.
        environment: dev
        strategy:
          # Simplest deployment strategy, run the steps once, done.
          runOnce:
            deploy:
              steps:
                # Download the artifact uploaded by the Build stage.
                # It lands at $(Pipeline.Workspace)/toolbox-api/ on this agent.
                - download: current
                  artifact: toolbox-api

                # Deploy the artifact zip to the Azure App Service.
                # AzureWebApp@1 uses the Kudu deployment engine under the hood.
                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service (Dev)'
                  inputs:
                    azureSubscription: 'azure-toolbox-connection'
                    appType: webAppLinux
                    appName: $(devAppServiceName)
                    package: $(Pipeline.Workspace)/toolbox-api

  # ─────────────────────────────────────────────
  # STAGE 3: Deploy to Production
  # Only runs after Deploy_Dev succeeds.
  # The 'production' environment has an Approvals check configured in
  # Azure DevOps. The pipeline will PAUSE here and email you before
  # continuing. You must click Approve in the DevOps UI to proceed.
  # ─────────────────────────────────────────────
  - stage: Deploy_Production
    displayName: Deploy → Production
    dependsOn: Deploy_Dev
    condition: succeeded()
    jobs:
      - deployment: DeployProd
        displayName: 'Deploy to Production App Service'
        pool:
          vmImage: ubuntu-latest
        # The pipeline will pause here until it has been approved in DevOps.
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: toolbox-api

                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service (Production)'
                  inputs:
                    azureSubscription: 'azure-toolbox-connection'
                    appType: webAppLinux
                    appName: $(prodAppServiceName)
                    package: $(Pipeline.Workspace)/toolbox-api